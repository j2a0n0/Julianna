text.full_lean_canvas_helper_content = "Le comité de recherche complet vous guidera tout au long du processus de validation des idées.<br/>Sur cette page, vous vous adresserez une fois de plus à votre segment client, problème, solution (mais ne vous inquiétez pas, si vous l'avez déjà rempli sur le simple tableau, vous le reverrez ici!).<br/>De là, vous passerez à la proposition de valeur claire (Qu'est-ce qui rend votre idée meilleure que d'autres offres?),<br/>Canaux de vente (Comment les clients obtiennent-ils votre solution?)<br/>Flux de revenus (Comment votre solution fait-elle de l'argent?)<br/>Structure des coûts (Combien vaut votre solution?) Principales mesures (Comment mesurez-vous le succès?)<br/>et l'avantage injuste (Qu'est-ce qui vous aide à vous démarquer de la concurrence?)<br/>Répondre à ces questions est conçu pour stimuler le succès, atténuer les échecs, et vous permettre de suivre et de valider vos hypothèses.<br/>Lean consiste à éliminer les déchets et à travailler à la construction de produits, de magasins et de solutions dont vos clients ont besoin."
