help.intro.explore = "Je vais découvrir par moi-même"
help.intro.hide = "Ne plus afficher ce message"
help.intro.home.text = "Votre tableau de bord personnel rassemble tout ce qui compte pour votre travail.<br />Vos tâches prioritaires y sont mises en avant et organisées pour vous.<br /><br />Des petites tâches aux grands objectifs, cet espace vous permet de noter vos idées, de suivre vos progrès et de célébrer vos réussites."
help.intro.dashboard.text = "Julianna vous aide à suivre vos progrès et à relier votre travail à vos objectifs.<br /><br />Commencez par définir ce que vous souhaitez accomplir :<br /><br />1. Définissez une vision et vos objectifs.<br />2. Planifiez le travail nécessaire pour les atteindre.<br />3. Organisez vos tâches quotidiennes sur votre tableau de bord personnel."
help.intro.project.title = "Gérer vos projets"
help.intro.project.text = "Dans Julianna, les projets sont des espaces partagés pour organiser et suivre les objectifs, les tâches et les jalons.<br /><br />Qu'il s'agisse de travail, d'études ou de projets personnels, vous y trouverez les outils pour concrétiser vos idées."
help.intro.goals.title = "Des objectifs pour garder le cap"
help.intro.goals.text = "Les objectifs découpent votre projet en résultats mesurables. Les jalons concernent la réalisation ; les objectifs décrivent les résultats visés.<br /><br />Donnez à chaque objectif un résultat clair et un indicateur. Vous pouvez ensuite lui associer des jalons."
help.intro.blueprints.title = "Définir vos projets facilement"
help.intro.blueprints.text = "Les canevas vous aident à structurer les informations du projet. Julianna propose notamment des modèles économiques, des analyses SWOT et des cartes d'empathie.<br /><br />Commencez par un canevas de valeur pour répondre à ces questions : qui est votre clientèle ? Quel problème résolvez-vous ? Quelle est votre solution ? Quelle valeur apporte-t-elle ?"
help.intro.blueprints.create = "Créer un canevas de valeur"
help.intro.wiki.title = "La documentation au bon endroit"
help.intro.wiki.text = "Rédigez et partagez des documents avec votre équipe. Organisez-les par équipe, sujet ou catégorie. Vous pouvez aussi ajouter des liens vers des fichiers ou dossiers de votre espace de stockage en ligne."
headlines.welcome_to_research_board = "Bienvenue sur votre tableau de recherche"
headlines.welcome_to_simple_research_board = "Bienvenue sur votre tableau de recherche simplifié"
text.simple_lean_canvas_helper_content = "Utilisez ce tableau pour décrire votre clientèle, le problème qu'elle rencontre et votre solution. Ces premières réponses vous aideront à tester et à affiner votre idée."
notifications.installation_success_setup_account = "L'installation a été réussie, mettons en place votre compte et vos préférences"
text.milestone_helper_content = "Dans Julianna, les jalons représentent des phases assorties d’un résultat clair. Ils ont une date de début, une date de fin et couvrent une part importante du travail du projet.<br />Les objectifs portent sur les résultats à atteindre, tandis que les jalons structurent l’exécution. À la fin d’un jalon, vous devriez disposer d’un résultat tangible."
