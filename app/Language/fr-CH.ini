text.zulip_instructions = "Cette intégration affichera les notifications de mise à jour sur le flux et le sujet de votre choix.<br/>Suivez les instructions<a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>ici pour créer un nouveau bot</a>. Puis collez l'information dans le formulaire à droite et cliquez sur Enregistrer."
text.telegram_instructions = "Cette intégration publiera des notifications de mise à jour sur un chat Telegram.<br/>Créez un bot avec <a href='https://core.telegram.org/bots#how-do-i-create-a-bot' target='_blank'>@BotFather</a> et collez le jeton à droite. Envoyez un message à votre bot une fois et cliquez sur Enregistrer pour détecter automatiquement le chat – ou, pour un groupe avec des sujets activés, collez directement l'ID de chat et l'ID de sujet du groupe."
text.discord_instructions = "Cette intégration postera des notifications de mise à jour sur le canal de votre choix.<br/>Suivez les instructions <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>ici pour créer un ou plusieurs nouveaux webhooks </a>, puis collez le ou les liens dans les champs à droite et cliquez sur Enregistrer."
text.no_conclusion_yet = "<i>Pas de conclusion pour l'instant</i>"
text.no_users_assigned_to_this_client = "Pas de contact pour ce client. Ajouter et assigner des utilisateur <a href='/users/showAll'>ici</a>"
text.confirm_delete_timesheet = "La feuille de temps sera supprimée. Etes-vous sûr ?"
text.timer_on_todo = "<span class='head-icon fa fa-stop'></span> %1$s Timer sur %2$s"
text.these_are_system_wide_settings = "Ces paramètres système affectent l'apparence de votre environnement Julianna."
text.company_name_helper = "Apparaît dans le titre de la page et dans les e-mails"
text.advanced_boards_helper_content = "Les idées évoluent, grandissent et mûrissent. C'est l'endroit idéal pour les suivre.<br/>Déplacez les cartes d'idées d'une colonne à l'autre pour refléter leur état actuel.<br/>C'est un bon endroit pour commencer la recherche, développer des prototypes et valider ces prototypes avec quelques clients avant de commencer à mettre en œuvre."
text.backlog_helper_content = "Un arriéré est le foyer de toutes vos tâches; celles sur lesquelles vous travaillez actuellement et vous prévoyez de travailler.<br/><br/>Pour faire des progrès vers l'achèvement de votre arriéré, nous vous recommandons de travailler dans de courtes itérations - Sprints.<br/>Les sprints sont des intervalles de temps de deux semaines qui vous permettent de vous concentrer sur des morceaux de travail plus petits et livrables.<br/>À la fin de deux semaines, vous devriez avoir quelque chose à 'demo'. Quelque chose qui fournit de la valeur à vos utilisateurs ou clients.<br/><br/>Sur cet écran, vous pourrez organiser et gérer votre liste de tâches, prioriser votre arriéré par glisser-déposer et déplacer les éléments Backlog dans votre Sprint actuel.<br/>Vous voulez plus d'informations? Commencez la tournée ou à proximité pour commencer!"
text.glad_youre_here = "Nous sommes heureux que vous soyez ici. Prenons une minute pour faire connaissance."
text.business_research_section = "Notre section Recherche est votre nouveau foyer pour vos idées. Cette section est conçue pour vous guider à travers les étapes de développement client, de recherche de problèmes et d'idéation de solutions."
text.our_roadmap_design = "Notre feuille de route est conçue pour vous conduire depuis des petites étapes gérables jusqu'à la réalisation d'un grand projet. Planifiez des jalons d'environ 3 mois et utilisez ces jalons de projet pour rester focalisé sur la cible."
text.this_is_where_you_spend_most_time = "C'est là que vous passerez le plus clair de votre temps. Planifiez vos Sprints de 2 semaines et exécutez-les avec succès avec le tableau Kanban et nos outils Backlog. Utilisez Retrospectives pour apprendre de vos erreurs et améliorer votre prochain Sprint."
text.idea_board_helper_content = "C'est l'endroit où rassembler toutes vos idées. Discutez de nouvelles idées avec votre équipe et attachez des jalons pour voir les progrès."
text.kanban_helper_content = "Kanban est le mot japonais pour \"carte\". Les planches Kanban ont été lancées par les ingénieurs Toyota dans les années 40 avec la fabrication Lean.<br/>Il est utilisé pour partager visuellement l'information et progresser rapidement.<br/>Les conseils Kanban sont utiles pour visualiser le travail et le statut, pour aider à gérer le travail actif ou en cours, gérer le flux de travail et agir rapidement vers des améliorations maigres."
text.my_timesheets_helper_content = "Les feuilles de temps sont l'endroit idéal pour suivre les heures réelles de travail sur une tâche.<br/>Ceci est utile à des fins de facturation, mais aussi pour valider dans quelle mesure vous planifiez vos tâches à l'avance.<br/>Les heures supplémentaires peuvent ajuster les dates d'échéance pour tenir compte des écarts de planification."
text.new_project_helper_content = "<p> C'est ici que vous allez décrire, définir et définir les paramètres de votre projet. Ceci est important car c'est l'élément qui communique à toute<br/>l'équipe les priorités, les attentes et les directives du projet.</p><p><br/><em>Points à considérer ici: les 4C .<br/>Soyez clair, soyez concis, complet et crédible.<br/><br/></em></p> <p> La maîtrise de ces éléments dans vos descriptions de projet permet à tout le monde d'être sur la même longueur d'onde et vous aide à minimiser les risques d'erreur ou de faux pas.</p><br/>Il est temps de commencer!<br/><br/>"
text.not_found_helper_content = "<p>Nous n'avons pas encore de contenu pour cette page.<br/>Veuillez utiliser notre lien 'Besoin d'aide' en bas pour en savoir plus sur ce que vous pouvez faire ici.</p>"
text.retros_helper_content = "<p>Les rétrospectives sont des réflexions rapides sur le travail, le fonctionnement de l'équipe et bien sûr les progrès.<br/>C'est là que votre équipe peut prendre un moment pour se concentrer sur ce qui s'est bien passé, ce qui n'a pas bien fonctionné et ce qui pourrait être fait différemment la prochaine fois.<br/>Nous vous recommandons d'organiser une réunion d'examen à intervalles réguliers, ou au minimum, à la fin de chaque jalon.<br/></p>"
text.roadmap_helper_content = "<p>Les feuilles de route sont utiles pour réduire les grands projets en morceaux plus petits et plus faciles à gérer.<br/><br/></p> <p> Pour créer votre feuille de route, nous vous recommandons de définir des jalons pouvant être atteints dans un délai de 3 mois. </p> <p> Les jalons sont des points de contrôle sur le chemin de l'achèvement du projet.<br/>En termes simples: si vous faites un voyage en voiture à travers le pays, chaque état que vous traversez pourrait être un jalon.<br/><br/>Cliquez sur 'Ajouter un jalon' en haut à gauche pour commencer. Définissez la date sur cet onglet ou dans le graphique de la feuille de route lui-même en cliquant et en faisant glisser le jalon dans le calendrier.</p>"
text.show_clients_helper_content = "<p>Les clients / produits organisent vos projets en catégories et vous permettent d'isoler différents groupes.<br/><br/></p> <p> En tant que consultant, vous travaillez déjà avec des clients et ce serait l'endroit pour les organiser. </p> <p> Si vous êtes une équipe produit, vous pouvez utiliser cette section pour organiser et isoler vos départements (marketing, ventes, opérations, etc.).</p>"
text.show_projects_helper_content = "<p>Les projets sont au cœur de votre entreprise et le moment lent! Changement, développement, objectifs, et tout ce que vous pouvez construire ou rêvez de sera implique des projets.<br/>La gestion de projet est simplement le processus pour s'assurer que vos projets sont livrés en temps opportun, correctement et avec une valeur opérationnelle réelle.<br/><br/>C'est là que vos projets vont vivre. La page de vos projets vous permettra de créer un projet, de faire rapidement des nombres, des heures, des budgets et le client associé au projet.<br/><br/>Utilisez cette page pour un aperçu rapide de tous vos projets.<br/><br/></p>"
