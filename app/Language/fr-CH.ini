text.insights.helper_content = "Les<em>Observer / apprendre - Insights</em>Le conseil d'administration vous aide à recueillir des informations structurelles provenant de quatre sources différentes (observations ethnographiques, entrevues, groupes de discussion et recherche secondaire) et à les transformer en connaissances.<br/>Il soutient les étapes d'observation et d'apprentissage, parfois appelées empathie et définition, du processus de pensée de conception.<br/>Nous vous suggérons d'utiliser le<em>Observer / apprendre - Insights</em>chaque fois que vous recueillez et analysez de nouvelles idées, que ce soit pour une analyse des risques, une analyse environnementale, la découverte des tendances de l'industrie ou pour la conception de nouveaux produits et services, pour n'en nommer que quelques-uns."
