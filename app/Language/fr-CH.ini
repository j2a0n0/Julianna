text.mattermost_instructions = "Cette intégration postera des notification de mise à jour sur le canal de votre choix.<br/>Suivez les instructions <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>ici pour obtenir une URL Webhook entrante URL</a> depuis Mattermost. Ensuite, collez le lien dans le formulaire à droite et cliquez sur Enregistrer."
text.slack_instructions = "Cette intégration postera des notification de mise à jour sur le canal de votre choix.<br/>Suivez les instructions <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>ici pour obtenir une URL Webhook entrante</a> depuis Slack. Ensuite, collez le lien dans le formulaire à droite et cliquez sur Enregistrer."
