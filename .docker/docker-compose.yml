name: julianna

services:
  julianna_db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${JULIANNA_DB_DATABASE:-julianna}
      MYSQL_USER: ${JULIANNA_DB_USER:-julianna}
      MYSQL_PASSWORD: ${JULIANNA_DB_PASSWORD:?Set JULIANNA_DB_PASSWORD in .docker/.env}
      MYSQL_ROOT_PASSWORD: ${JULIANNA_DB_ROOT_PASSWORD:?Set JULIANNA_DB_ROOT_PASSWORD in .docker/.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - julianna_db_data:/var/lib/mysql
    networks:
      - julianna
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  julianna:
    image: julianna/app:${JULIANNA_IMAGE_TAG:-${JULIANNA_VERSION:-dev}}
    pull_policy: build
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        JULIANNA_VERSION: ${JULIANNA_VERSION:-1.0.0-dev}
        JULIANNA_COMMIT: ${JULIANNA_COMMIT:-unknown}
        JULIANNA_SOURCE_URL: ${JULIANNA_SOURCE_URL:-}
        PUID: ${JULIANNA_PUID:-1000}
        PGID: ${JULIANNA_PGID:-1000}
    restart: unless-stopped
    environment:
      JULIANNA_ENV: ${JULIANNA_ENV:-local}
      JULIANNA_APP_URL: ${JULIANNA_APP_URL:-http://localhost:8080}
      JULIANNA_APP_DIR: ${JULIANNA_APP_DIR:-}
      JULIANNA_APP_KEY: ${JULIANNA_APP_KEY:?Set JULIANNA_APP_KEY in .docker/.env}
      JULIANNA_SOURCE_URL: ${JULIANNA_SOURCE_URL:-}
      JULIANNA_VERSION: ${JULIANNA_VERSION:-1.0.0-dev}
      JULIANNA_COMMIT: ${JULIANNA_COMMIT:-unknown}
      JULIANNA_DEBUG: ${JULIANNA_DEBUG:-0}
      JULIANNA_SESSION_SECURE: ${JULIANNA_SESSION_SECURE:-false}
      JULIANNA_SESSION_EXPIRATION: ${JULIANNA_SESSION_EXPIRATION:-480}
      JULIANNA_DB_HOST: julianna_db
      JULIANNA_DB_PORT: 3306
      JULIANNA_DB_DATABASE: ${JULIANNA_DB_DATABASE:-julianna}
      JULIANNA_DB_USER: ${JULIANNA_DB_USER:-julianna}
      JULIANNA_DB_PASSWORD: ${JULIANNA_DB_PASSWORD:?Set JULIANNA_DB_PASSWORD in .docker/.env}
      JULIANNA_SITENAME: ${JULIANNA_SITENAME:-Julianna}
      JULIANNA_LANGUAGE: ${JULIANNA_LANGUAGE:-en-US}
      JULIANNA_DEFAULT_TIMEZONE: ${JULIANNA_DEFAULT_TIMEZONE:-Europe/Zurich}
      JULIANNA_REGISTRATION_ENABLED: ${JULIANNA_REGISTRATION_ENABLED:-true}
      JULIANNA_LOG_CHANNELS: ${JULIANNA_LOG_CHANNELS:-stderr}
      JULIANNA_EMAIL_RETURN: ${JULIANNA_EMAIL_RETURN:-}
      JULIANNA_EMAIL_USE_SMTP: ${JULIANNA_EMAIL_USE_SMTP:-false}
      JULIANNA_EMAIL_SMTP_HOSTS: ${JULIANNA_EMAIL_SMTP_HOSTS:-}
      JULIANNA_EMAIL_SMTP_AUTH: ${JULIANNA_EMAIL_SMTP_AUTH:-true}
      JULIANNA_EMAIL_SMTP_USERNAME: ${JULIANNA_EMAIL_SMTP_USERNAME:-}
      JULIANNA_EMAIL_SMTP_PASSWORD: ${JULIANNA_EMAIL_SMTP_PASSWORD:-}
      JULIANNA_EMAIL_SMTP_AUTO_TLS: ${JULIANNA_EMAIL_SMTP_AUTO_TLS:-true}
      JULIANNA_EMAIL_SMTP_SECURE: ${JULIANNA_EMAIL_SMTP_SECURE:-}
      JULIANNA_EMAIL_SMTP_PORT: ${JULIANNA_EMAIL_SMTP_PORT:-}
      JULIANNA_AI_PROVIDER: ${JULIANNA_AI_PROVIDER:-}
      JULIANNA_AI_MODEL: ${JULIANNA_AI_MODEL:-}
      JULIANNA_AI_REQUESTS_PER_HOUR: ${JULIANNA_AI_REQUESTS_PER_HOUR:-20}
      JULIANNA_AI_API_KEY: ${JULIANNA_AI_API_KEY:-}
      JULIANNA_AI_API_KEY_FILE: ${JULIANNA_AI_API_KEY_FILE:-}
      JULIANNA_WEB_SEARCH_API_KEY: ${JULIANNA_WEB_SEARCH_API_KEY:-}
    ports:
      - "${JULIANNA_BIND_ADDRESS:-127.0.0.1}:${JULIANNA_PORT:-8080}:8080"
    volumes:
      - julianna_userfiles:/var/www/html/userfiles
      - julianna_public_userfiles:/var/www/html/public/userfiles
      - julianna_plugins:/var/www/html/app/Plugins
      - julianna_storage:/var/www/html/storage
    networks:
      - julianna
    security_opt:
      - no-new-privileges:true
    depends_on:
      julianna_db:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  julianna_db_data:
  julianna_userfiles:
  julianna_public_userfiles:
  julianna_plugins:
  julianna_storage:

networks:
  julianna:
