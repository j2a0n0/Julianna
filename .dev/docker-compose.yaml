

name: julianna-dev

services:
  julianna-dev:
    container_name: julianna-dev
    build: .
    ports:
      - "5080:8080" #Using ports that are hopefully available. format is: 80XX
      - "5443:443" #Using ports that are hopefully available. format is: 443XX (available range is 44300–44399)
    extra_hosts:
      - "host.docker.internal:host-gateway"
#      - "authentik.docker.local:172.28.0.2"
    volumes:
     - "../:/var/www/html"
     - "./xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini"
     - "./error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini"
    environment:
      JULIANNA_DB_HOST: 'julianna-db'
      JULIANNA_DB_USER: 'julianna'
      JULIANNA_DB_PASSWORD: 'julianna'
      JULIANNA_DB_DATABASE: 'julianna'
      JULIANNA_DB_PORT: '3306'

    depends_on:
      julianna-db:
        condition: service_healthy
    networks:
      - julianna_internal
      - julianna
#      - traefik
#    labels:
#      - "traefik.enable=true"
#      - "traefik.priority=2"
#      - "traefik.docker.network=traefik"
#
#      # HTTP Router
#      - "traefik.http.routers.julianna.rule=Host(`julianna.docker.local`)"
#      - "traefik.http.services.julianna.loadbalancer.server.port=8080"
#      - "traefik.http.routers.julianna.tls=true"


  julianna-redis:
    container_name: julianna-redis
    image: redis:4.0
    ports:
      - "6379"
    networks:
      - julianna_internal
  julianna-db:
    image: mysql:8.4
    ports:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: 'julianna'
      MYSQL_USER: 'julianna'
      MYSQL_PASSWORD: 'julianna'
      MYSQL_DATABASE: 'julianna'
    networks:
      - julianna_internal
    volumes:
      - julianna-mysql:/var/lib/mysql:rw
    healthcheck:
      test: "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1'"
      interval: 5s
      timeout: 5s
      retries: 20

  selenium:
    image: selenium/standalone-chromium
    shm_size: 2gb
    environment:
      - SCREEN_WIDTH=2560
      - SCREEN_HEIGHT=1440
    ports:
      - "4444"
      - "7900"
    networks:
      - julianna_internal
  maildev:
    image: maildev/maildev
    environment:
      - MAILDEV_SMTP_PORT=465
      - MAILDEV_WEB_PORT=8081
    ports:
      - "8081"
    networks:
      - julianna_internal
  s3ninja:
    image: scireum/s3-ninja
    ports:
      - "8083"
    networks:
      - julianna_internal
    volumes:
      - s3ninja-data:/home/sirius/data


networks:
  julianna_internal:
    driver: bridge
    name: julianna_internal
  julianna:
    driver: bridge
#  traefik:
#    external: true
#    name: traefik

volumes:
  julianna-mysql:
  s3ninja-data:
