name: Julianna Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public version tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

env:
  IMAGE_NAME: julianna/app

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${REQUESTED_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Check out exact public tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify tagged source and independence
        shell: bash
        run: |
          test "$(git describe --tags --exact-match)" = "${{ steps.release.outputs.tag }}"
          bash scripts/check-independent-release.sh
          source_url="https://github.com/${GITHUB_REPOSITORY}/tree/${{ steps.release.outputs.tag }}"
          curl --fail --silent --show-error --location "${source_url}" >/dev/null
          echo "JULIANNA_SOURCE_URL=${source_url}" >> "${GITHUB_ENV}"
          echo "JULIANNA_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Julianna image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
          build-args: |
            JULIANNA_VERSION=${{ steps.release.outputs.version }}
            JULIANNA_COMMIT=${{ env.JULIANNA_COMMIT }}
            JULIANNA_SOURCE_URL=${{ env.JULIANNA_SOURCE_URL }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          --verify-tag
          --title "Julianna ${{ steps.release.outputs.version }}"
          --generate-notes
